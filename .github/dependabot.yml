version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: daily}
  # Development tools, kept out of the server's module graph.
  - package-ecosystem: gomod
    directory: /tools
    schedule: {interval: weekly}
  # The documentation theme (Docsy and its Hugo modules).
  - package-ecosystem: gomod
    directory: /docs
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/dev-image, /.github/actions/go-cache, /.github/actions/runtime-image]
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: devcontainers
    directory: /
    schedule: {interval: weekly}
