# Local stack for the devcontainer, integration tests and DAST.
# Images are pinned by digest; Dependabot keeps them current.
#
# `docker compose up -d` starts a working server, with S3, and client, a
# developer's machine in a container to try it from. The devcontainer (service
# dev) runs in the same stack.
#
# Every container reaches the others by service name on the compose network:
# SSH at naraen:2222, the Batch API at https://naraen:8443, S3 at
# http://s3:8333 and the dev OIDC issuer at http://oidc:8080. Pre-signed links,
# the Batch API's href and the issuer's tokens name those hosts, so a client
# must resolve them too. Containers on the network do; to use the stack from
# the host, where the ports are published on 127.0.0.1, add
# "127.0.0.1 naraen s3 oidc" to the hosts file.
#
# Nothing in the stack is bind-mounted from the repository, except into the
# devcontainer itself. The devcontainer runs compose against the host's Docker
# (docker-outside-of-docker), which would resolve ./ against the host, where
# /workspaces/naraen does not exist; worse, the differing paths would make
# compose recreate services with broken mounts. Configuration goes into images
# through the build context, which the Docker client uploads from wherever it
# runs, or through SeaweedFS's own shell.
name: naraen

services:
  # Local S3. MinIO would be the natural choice, but it no longer publishes anonymously
  # pullable images, so SeaweedFS stands in. Swap S3_IMAGE to change it.
  s3:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:latest@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860}
    # Identities and signature checks come from s3-init. Until it has run,
    # SeaweedFS serves anyone, so everything that uses S3 waits for it.
    command: ["server", "-s3", "-dir=/data"]
    ports: ["127.0.0.1:8333:8333"]
    volumes: ["s3-data:/data"]

  # Configures SeaweedFS through its own shell, then exits; idempotent. Two
  # identities with public development credentials: admin, which the
  # integration tests use to create and inspect buckets, and signer, which the
  # server signs links with and which may only read and write objects, as the
  # Signer role in production. Configuring any identity turns on signature
  # checks, so tests of signed links prove something. Then the bucket the dev
  # server stores objects in. `docker compose run --rm s3-init` prepares S3
  # alone, as the integration workflow does.
  s3-init:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:latest@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860}
    depends_on: [s3]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        b=naraen-dev
        w() { echo "$$*" | /usr/bin/weed shell -master=s3:9333 2>&1; }
        for i in $$(seq 60); do
          w s3.configure -user=admin -access_key=naraen-dev-admin -secret_key=naraen-dev-admin-secret-not-for-production -actions=Admin,Read,Write,List,Tagging -apply >/dev/null
          w s3.configure -user=signer -access_key=naraen-dev-signer -secret_key=naraen-dev-signer-secret-not-for-production -actions=Read,Write -apply >/dev/null
          w s3.bucket.list | grep -qw "$$b" || w s3.bucket.create -name "$$b" >/dev/null
          if w s3.configure | grep -q naraen-dev-signer && w s3.bucket.list | grep -qw "$$b"; then
            exit 0
          fi
          sleep 1
        done
        echo "S3 not configured" >&2
        exit 1

  naraen:
    build:
      context: .
      # The runtime image plus the development files from test/testdata.
      target: runtime-dev
    depends_on:
      s3-init:
        condition: service_completed_successfully
    environment:
      # Development mode, with the committed public development host key, TLS
      # certificate and client keys (test/testdata/devkeys), which the server
      # refuses outside it. The token key is ephemeral. The files are in the
      # image, under /etc/naraen.
      NARAEN_DEV: "true"
      NARAEN_SSH_HOST_KEY_FILE: /etc/naraen/ssh_host_ed25519_key
      NARAEN_TLS_CERT_FILE: /etc/naraen/tls.crt
      NARAEN_TLS_KEY_FILE: /etc/naraen/tls.key
      NARAEN_SNAPSHOT_FILE: /etc/naraen/snapshot.json
      NARAEN_SNAPSHOT_MAX_AGE: 87600h  # the static snapshot is loaded once and never re-synced
      NARAEN_S3_BUCKET: naraen-dev
      # Names every client resolves on the compose network. Plain http to a
      # host other than loopback is accepted for S3 only in development mode.
      NARAEN_PUBLIC_URL: https://naraen:8443
      NARAEN_S3_ENDPOINT: http://s3:8333
      # The signer's public development credentials, from a file as in any
      # deployment without an instance role.
      AWS_REGION: us-east-1
      AWS_SHARED_CREDENTIALS_FILE: /etc/naraen/aws-credentials
      AWS_EC2_METADATA_DISABLED: "true"
    ports: ["127.0.0.1:2222:2222", "127.0.0.1:8443:8443"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # No healthcheck: distroless has no shell or curl, and the binary is not an
    # HTTP client, so compose --wait waits for the container to run, and
    # scripts/dast.sh's walkthrough proves it serves.

  # A development OIDC issuer standing in for GitHub Actions
  # (cmd/naraen-dev-oidc), so CI jobs can be played from the client: a job
  # asks http://oidc:8080/token?audience=naraen-dev&repository_id=1&repository=example/repo
  # for a token and exchanges it at https://naraen:8443/example/repo/ci/token.
  # The dev snapshot trusts its committed key for that audience, and the
  # server refuses that trust outside development mode.
  oidc:
    build:
      context: .
      target: dev-oidc
    environment:
      NARAEN_DEV_OIDC_ISSUER: http://oidc:8080
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # A developer's machine: git, git-lfs and ssh, with the dev keys and the dev
  # server's host key and certificate already trusted (the client stage of the
  # Dockerfile). `docker compose exec client bash`, then clone, track and push
  # as a developer would; `naraen-smoke` runs the walkthrough.
  client:
    build:
      context: .
      target: client
    depends_on: [naraen, oidc]

  # The devcontainer (.devcontainer/devcontainer.json). Profile dev keeps a
  # plain `docker compose up` from building the toolchain image; naming it
  # (`docker compose run --rm dev task check`) starts it. The integration
  # tests reach S3 by service name from here.
  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    command: ["sleep", "infinity"]
    security_opt: ["seccomp=unconfined"]
    environment:
      GOFLAGS: -mod=readonly
      NARAEN_TEST_S3_ADDR: s3:8333
    volumes:
      - .:/workspaces/naraen
      - gomod:/go/pkg
      - gocache:/home/vscode/.cache

  # ---- DAST tools (profile "dast") ----
  # Run by scripts/dast.sh, which copies each tool's inputs in and its reports
  # out through the Docker API instead of bind mounts (see the top of this
  # file), and makes sure the server is up first.
  zap-api:
    profiles: [dast]
    image: ghcr.io/zaproxy/zaproxy:stable@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238
    # Authenticated: dast.sh sets NARAEN_DAST_TOKEN to a writer token for
    # example/repo, and .zap/auth_hook.py makes ZAP send it on every request,
    # so the scan reaches the Batch API's storage checks and link signing.
    # Listed without a value, it is passed only when set.
    environment: [NARAEN_DAST_TOKEN]
    command: >
      zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi
      -O https://naraen:8443 -c /zap/wrk/rules.tsv -r zap-api.html -I
      --hook /zap/wrk/auth_hook.py

  zap-baseline:
    profiles: [dast]
    image: ghcr.io/zaproxy/zaproxy:stable@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238
    command: >
      zap-baseline.py -t https://naraen:8443 -c /zap/wrk/rules.tsv
      -r zap-baseline.html

  testssl:
    profiles: [dast]
    image: drwetter/testssl.sh:latest@sha256:9fc0395106bf1df9a20695d04d6fda09c56301cd62a63cb24aedaa27f991a1e4
    # Findings are written as JSON and judged by scripts/dast.sh, because
    # testssl.sh itself exits 0 whatever it finds.
    command: ["--severity", "LOW", "-p", "-E", "-U", "-h", "-S", "--quiet", "--color", "0", "--jsonfile", "/tmp/testssl.json", "naraen:8443"]

  nuclei:
    profiles: [dast]
    image: projectdiscovery/nuclei:latest@sha256:582d5546902e67052097cb2d07296c642d50a1afc5e44623cb038845df9a32eb
    command: ["-u", "https://naraen:8443", "-severity", "low,medium,high,critical", "-tags", "tls,misconfig,exposure,cve", "-silent", "-nc", "-fr", "-eid", "self-signed-ssl"]

  ssh-audit:
    profiles: [dast]
    image: positronsecurity/ssh-audit:latest@sha256:6d5dee75fe91b5f6279f683f0e7d4374d2ba83e2227c8d9a17097aac2775127d
    # Policy mode: fails unless the server offers exactly the audited algorithm set.
    command: ["-P", "/policy/naraen.policy", "naraen:2222"]

  # ---- Dependency scan (profile "scan"), run by the security workflow ----
  # Kept here rather than in the workflow so Dependabot updates its pin.
  # Call analysis is off because the image's Go toolchain can lag go.mod;
  # reachability is govulncheck's job in task vuln. Exceptions live in
  # osv-scanner.toml.
  osv-scanner:
    profiles: [scan]
    image: ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
    command: ["scan", "--recursive", "--no-call-analysis=go", "--lockfile=go.mod:/src/go.mod"]
    working_dir: /src
    volumes: [".:/src:ro"]

volumes:
  s3-data:
  gomod:
  gocache:
