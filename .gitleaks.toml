title = "naraen"

[extend]
useDefault = true

# Only the committed development keys are allowed through: the client keys,
# the server's SSH host key, its TLS key, the dev OIDC issuer's key and the
# webhook secret. They are public on purpose (test/testdata/devkeys/README.md)
# and refused outside dev mode. Any other secret, in any fixture folder, must
# still fail the scan.
[allowlist]
description = "Public development keys"
paths = [
  '''^test/testdata/devkeys/(reader|writer|ssh_host_ed25519_key|tls\.key|oidc\.key|webhook\.secret)$''',
]
