openapi: 3.0.3
info:
  title: naraen
  version: 0.1.0
  description: Git LFS server. The server issues pre-signed object-store URLs and never carries object bytes.
servers:
  - url: https://localhost:8443
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200": {description: Process is up}
  /readyz:
    get:
      summary: Readiness; 503 until a fresh datastore snapshot is loaded
      responses:
        "200": {description: Ready}
        "503": {description: Not ready or snapshot stale}
  # git-lfs-authenticate returns href https://<host>/{owner}/{repo}, and the
  # client appends /objects/batch to it.
  /{owner}/{repo}/objects/batch:
    post:
      summary: LFS Batch API
      security: [{bearer: []}]
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string, maxLength: 100}}
        - {name: repo, in: path, required: true, schema: {type: string, maxLength: 100}}
      requestBody:
        required: true
        content:
          application/vnd.git-lfs+json:
            schema:
              type: object
              required: [operation, objects]
              properties:
                operation: {type: string, enum: [download, upload]}
                transfers: {type: array, items: {type: string}, description: "Must include basic when present"}
                hash_algo: {type: string, enum: [sha256]}
                objects:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [oid, size]
                    properties:
                      oid: {type: string, pattern: "^[0-9a-f]{64}$"}
                      size: {type: integer, minimum: 0, maximum: 5368709120}
      responses:
        "200":
          description: One entry per distinct object, in request order
          content:
            application/vnd.git-lfs+json:
              schema: {$ref: "#/components/schemas/BatchResponse"}
        "401":
          description: >-
            Missing or invalid token, a token minted for another repo or
            operation, or an unknown repository. All look the same, so the
            answer never reveals whether a repository exists.
          content: {application/vnd.git-lfs+json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: The token is valid but the current grant no longer allows the operation
          content: {application/vnd.git-lfs+json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: Invalid request body
          content: {application/vnd.git-lfs+json: {schema: {$ref: "#/components/schemas/Error"}}}
        "503":
          description: Datastore not ready or stale, or storage not configured
          content: {application/vnd.git-lfs+json: {schema: {$ref: "#/components/schemas/Error"}}}
  /{owner}/{repo}/ci/token:
    post:
      summary: CI token exchange
      description: >-
        A CI workload presents an OIDC token from an issuer the datastore
        trusts (RS256 or ES256, verified against the trust entry's JWKS, with
        exactly the entry's audience) and receives a read-only LFS token for
        the repo the token's repo claim names, which must be the repo in the
        URL. The body has the shape git-lfs-authenticate prints.
      security: [{bearer: []}]
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string, maxLength: 100}}
        - {name: repo, in: path, required: true, schema: {type: string, maxLength: 100}}
      responses:
        "200":
          description: A read-only LFS token
          content:
            application/json:
              schema:
                type: object
                required: [href, header, expires_in]
                properties:
                  href: {type: string}
                  header: {type: object, additionalProperties: {type: string}}
                  expires_in: {type: integer}
        "401":
          description: Missing, malformed, expired or untrusted OIDC token
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: A valid token for another repo, or no workload grant on this one
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "503":
          description: Datastore not ready or stale
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  /webhooks/github:
    post:
      summary: GitHub webhook; body is authenticated by X-Hub-Signature-256
      parameters:
        - {name: X-Hub-Signature-256, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      description: >-
        Served only when a webhook secret is configured. organization
        member_removed, member removed and deploy_key deleted remove access
        at once; every other event is accepted and ignored. Only removals
        are applied, so a replayed delivery can at worst deny until the next
        full sync.
      responses:
        "202": {description: Accepted}
        "400": {description: Malformed payload}
        "401": {description: Bad signature}
        "413": {description: Body over 1 MiB}
components:
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: {type: string}
    Action:
      type: object
      required: [href, expires_at]
      properties:
        href: {type: string, description: "Pre-signed object-store URL, valid for 15 minutes"}
        header: {type: object, additionalProperties: {type: string}, description: "Headers the client must send; upload links sign x-amz-checksum-sha256"}
        expires_at: {type: string, format: date-time}
    BatchResponse:
      type: object
      required: [transfer, objects]
      properties:
        transfer: {type: string, enum: [basic]}
        hash_algo: {type: string, enum: [sha256]}
        objects:
          type: array
          items:
            type: object
            required: [oid, size]
            properties:
              oid: {type: string}
              size: {type: integer}
              authenticated: {type: boolean, description: "True when actions carry their own authorization"}
              actions:
                type: object
                description: "Absent for an upload of an object already stored"
                properties:
                  upload: {$ref: "#/components/schemas/Action"}
                  download: {$ref: "#/components/schemas/Action"}
              error:
                type: object
                description: "404 object not stored, 422 size differs, 500 storage failed"
                properties:
                  code: {type: integer}
                  message: {type: string}
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
