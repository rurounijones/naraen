name: Release
on:
  push: {tags: ["v*"]}
permissions: {contents: read}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # A tag can point at any commit; only reviewed commits on main are released.
  on-main:
    name: Tag on main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  # The same gates as `task ci`, run on the tagged commit.
  check:
    name: Code Quality
    uses: ./.github/workflows/ci.yml
  security:
    name: Security Checks
    uses: ./.github/workflows/security.yml
    permissions: {contents: read, security-events: write}
  integration:
    name: Integration Tests
    uses: ./.github/workflows/integration.yml
  fuzz:
    name: Fuzz Tests
    uses: ./.github/workflows/fuzz.yml
  mutation:
    name: Mutation Tests
    uses: ./.github/workflows/mutation.yml
  dast:
    name: Dynamic Security Scan
    uses: ./.github/workflows/dast.yml

  release:
    name: Publish
    needs: [on-main, check, security, integration, fuzz, mutation, dast]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: write, packages: write, id-token: write, attestations: write}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Container image for amd64 and arm64, built by the same Dockerfile that
      # the scan and DAST gates tested.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max
          push: true

      # Binaries, SBOMs and the signed checksum file are built and published by
      # goreleaser in the dev image, which pins goreleaser, cosign and syft and
      # carries the cross toolchain. The image is signed there too, with the
      # registry login mounted read-only.
      - name: Build dev image
        uses: ./.github/actions/dev-image
      - name: Sign image and release binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: >-
          docker run --rm -v "$PWD:/workspaces/naraen" -w /workspaces/naraen -u 0 -e HOME=/tmp
          -v "$HOME/.docker/config.json:/tmp/.docker/config.json:ro" -e DOCKER_CONFIG=/tmp/.docker
          -e GITHUB_TOKEN -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN
          -e IMAGE -e DIGEST naraen-dev bash -c
          'set -euo pipefail;
          git config --global --add safe.directory /workspaces/naraen;
          cosign sign --yes "$IMAGE@$DIGEST";
          goreleaser release --clean'

      # GitHub build provenance for the image and every release archive.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
