name: integration
on:
  push: {branches: [main]}
  pull_request:
  workflow_call:
permissions: {contents: read}
jobs:
  integration:
    # Production runs on arm64, so the real clients test that build as well.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # Starts S3 and gives it its identities and signature checks.
      - run: docker compose run --rm s3-init
      - name: Build dev image
        uses: ./.github/actions/dev-image
      - name: Run
        run: docker run --rm --network host -v "$PWD:/workspaces/naraen" -w /workspaces/naraen -u 0 -e HOME=/tmp naraen-dev task integration
