name: Security Checks
on:
  push: {branches: [main]}
  pull_request:
  workflow_call:
  schedule: [{cron: "17 4 * * *"}]
permissions: {contents: read}
jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions: {contents: read, security-events: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: {languages: go, queries: security-extended}
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
  scan:
    name: Trivy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Build dev image
        uses: ./.github/actions/dev-image
      # The dev container has no Docker, so the runtime image is built here and
      # mounted in as a tarball for ci-scan.
      - name: Build runtime image
        uses: ./.github/actions/runtime-image
      - name: Run
        run: docker run --rm -v "$PWD:/workspaces/naraen" -v "$RUNNER_TEMP:/ci:ro" -w /workspaces/naraen -u 0 -e HOME=/tmp -e GOFLAGS=-buildvcs=false naraen-dev bash -c "task ci-scan"
  osv:
    name: OSV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # The image and arguments live in docker-compose.yml, where Dependabot
      # keeps the digest pin current.
      - name: OSV-Scanner
        run: docker compose --profile scan run --rm osv-scanner
