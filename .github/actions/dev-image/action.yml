name: Build the dev image
description: >-
  Builds the dev stage of the Dockerfile as naraen-dev in the local Docker
  daemon, reusing layers cached by earlier runs. The cache is kept per runner
  architecture, because the image differs between amd64 and arm64.
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: dev
        tags: naraen-dev
        load: true
        cache-from: type=gha,scope=dev-${{ runner.arch }}
        cache-to: type=gha,scope=dev-${{ runner.arch }},mode=max
