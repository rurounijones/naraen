name: Fuzz Tests
on:
  pull_request:
  workflow_call:
  schedule: [{cron: "41 2 * * *"}]
permissions: {contents: read}
jobs:
  fuzz:
    name: Targets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Build dev image
        uses: ./.github/actions/dev-image
      - name: Run
        run: docker run --rm -v "$PWD:/workspaces/naraen" -w /workspaces/naraen -u 0 -e HOME=/tmp -e GOFLAGS=-buildvcs=false naraen-dev bash -c "task fuzz FUZZTIME=5m"
