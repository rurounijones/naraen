# Local stack for the devcontainer, integration tests and DAST.
# Images are pinned by digest; Dependabot keeps them current.
#
# `docker compose up -d` starts a working server: SSH on 127.0.0.1:2222, the
# Batch API on https://localhost:8443 and S3 on 127.0.0.1:8333. The devcontainer
# (service dev) runs in the same stack.
#
# s3, naraen and dev share one network namespace, owned by s3. Pre-signed links
# sign the S3 host, so the server must name S3 by an address its clients reach
# too: 127.0.0.1:8333 is S3 for the server, for the devcontainer, and through
# the published port for the host. Other containers on the compose network
# (the DAST tools) reach the server as naraen, an alias of that namespace.
name: naraen

services:
  # Local S3. MinIO would be the natural choice, but it no longer publishes anonymously
  # pullable images, so SeaweedFS stands in. Swap S3_IMAGE to change it.
  s3:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:latest@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860}
    # The identities file turns on signature checks; without it SeaweedFS
    # serves anyone, and tests of signed links would prove nothing. The
    # credentials in it are public development values.
    command: ["server", "-s3", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json"]
    # The namespace's published ports: S3, and the server's SSH and HTTPS.
    ports: ["127.0.0.1:8333:8333", "127.0.0.1:2222:2222", "127.0.0.1:8443:8443"]
    networks:
      default:
        aliases: [naraen]
    volumes: ["s3-data:/data", "./test/testdata/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"]

  # Creates the bucket the dev server maps example/repo to, then exits. It
  # goes through SeaweedFS's own shell, so the signer identity needs no
  # bucket-creation rights, as in production.
  s3-init:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:latest@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860}
    network_mode: service:s3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        b=naraen-dev
        weed() { echo "$$1" | /usr/bin/weed shell -master=127.0.0.1:9333 2>&1; }
        for i in $$(seq 60); do
          weed s3.bucket.list | grep -qw "$$b" && exit 0
          weed "s3.bucket.create -name $$b"
          sleep 1
        done
        echo "bucket $$b not created" >&2
        exit 1

  naraen:
    build:
      context: .
      target: runtime
    network_mode: service:s3
    depends_on:
      s3-init:
        condition: service_completed_successfully
    environment:
      # Development mode, with the committed public development host key, TLS
      # certificate and client keys (test/testdata/devkeys), which the server
      # refuses outside it. The token key is ephemeral.
      NARAEN_DEV: "true"
      NARAEN_SSH_HOST_KEY_FILE: /etc/naraen/ssh_host_ed25519_key
      NARAEN_TLS_CERT_FILE: /etc/naraen/tls.crt
      NARAEN_TLS_KEY_FILE: /etc/naraen/tls.key
      NARAEN_SNAPSHOT_FILE: /etc/naraen/snapshot.json
      NARAEN_SNAPSHOT_MAX_AGE: 87600h  # the static snapshot is loaded once and never re-synced
      NARAEN_S3_BUCKET: naraen-dev
      NARAEN_S3_ENDPOINT: http://127.0.0.1:8333
      # The signer's public development credentials, from a file as in any
      # deployment without an instance role.
      AWS_REGION: us-east-1
      AWS_SHARED_CREDENTIALS_FILE: /etc/naraen/aws-credentials
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./test/testdata/snapshot.json:/etc/naraen/snapshot.json:ro
      - ./test/testdata/seaweedfs/aws-credentials:/etc/naraen/aws-credentials:ro
      - ./test/testdata/devkeys/ssh_host_ed25519_key:/etc/naraen/ssh_host_ed25519_key:ro
      - ./test/testdata/devkeys/tls.crt:/etc/naraen/tls.crt:ro
      - ./test/testdata/devkeys/tls.key:/etc/naraen/tls.key:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # distroless has no shell or curl; the binary is not an HTTP client, so
      # readiness is checked from outside by compose --wait via the TCP port.
      test: ["NONE"]

  # The devcontainer (.devcontainer/devcontainer.json), in the server's
  # network namespace, so the README walkthrough and the integration tests
  # reach SSH, HTTPS and S3 on 127.0.0.1 exactly as from the host. Profile dev
  # keeps a plain `docker compose up` from building the toolchain image;
  # naming it (`docker compose run --rm dev task check`) starts it.
  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    network_mode: service:s3
    command: ["sleep", "infinity"]
    security_opt: ["seccomp=unconfined"]
    environment:
      GOFLAGS: -mod=readonly
    volumes:
      - .:/workspaces/naraen
      - gomod:/go/pkg
      - gocache:/home/vscode/.cache

  # ---- DAST tools (profile "dast") ----
  zap-api:
    profiles: [dast]
    image: ghcr.io/zaproxy/zaproxy:stable@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238
    command: >
      zap-api-scan.py -t /zap/wrk/api/openapi.yaml -f openapi
      -O https://naraen:8443 -c /zap/wrk/.zap/rules.tsv -r dast-reports/zap-api.html -I
    volumes: [".:/zap/wrk:rw"]
    depends_on: [naraen]

  zap-baseline:
    profiles: [dast]
    image: ghcr.io/zaproxy/zaproxy:stable@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238
    command: >
      zap-baseline.py -t https://naraen:8443 -c /zap/wrk/.zap/rules.tsv
      -r dast-reports/zap-baseline.html
    volumes: [".:/zap/wrk:rw"]
    depends_on: [naraen]

  testssl:
    profiles: [dast]
    image: drwetter/testssl.sh:latest@sha256:9fc0395106bf1df9a20695d04d6fda09c56301cd62a63cb24aedaa27f991a1e4
    # Findings are written as JSON and judged by scripts/dast.sh, because
    # testssl.sh itself exits 0 whatever it finds.
    command: ["--severity", "LOW", "-p", "-E", "-U", "-h", "-S", "--quiet", "--color", "0", "--jsonfile", "/out/testssl.json", "naraen:8443"]
    volumes: ["./dast-reports:/out:rw"]
    depends_on: [naraen]

  nuclei:
    profiles: [dast]
    image: projectdiscovery/nuclei:latest@sha256:582d5546902e67052097cb2d07296c642d50a1afc5e44623cb038845df9a32eb
    command: ["-u", "https://naraen:8443", "-severity", "low,medium,high,critical", "-tags", "tls,misconfig,exposure,cve", "-silent", "-nc", "-fr", "-eid", "self-signed-ssl"]
    depends_on: [naraen]

  ssh-audit:
    profiles: [dast]
    image: positronsecurity/ssh-audit:latest@sha256:6d5dee75fe91b5f6279f683f0e7d4374d2ba83e2227c8d9a17097aac2775127d
    # Policy mode: fails unless the server offers exactly the audited algorithm set.
    command: ["-P", "/policy/naraen.policy", "naraen:2222"]
    volumes: ["./.ssh-audit:/policy:ro"]
    depends_on: [naraen]

  # ---- Dependency scan (profile "scan"), run by the security workflow ----
  # Kept here rather than in the workflow so Dependabot updates its pin.
  # Call analysis is off because the image's Go toolchain can lag go.mod;
  # reachability is govulncheck's job in task vuln. Exceptions live in
  # osv-scanner.toml.
  osv-scanner:
    profiles: [scan]
    image: ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
    command: ["scan", "--recursive", "--no-call-analysis=go", "--lockfile=go.mod:/src/go.mod"]
    working_dir: /src
    volumes: [".:/src:ro"]

volumes:
  s3-data:
  gomod:
  gocache:
