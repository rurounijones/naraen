name: Build the runtime image
description: >-
  Builds the runtime stage of the Dockerfile, reusing layers cached by earlier
  runs, and saves it as a tarball at $RUNNER_TEMP/naraen-image.tar for a
  container without Docker to scan. The cache is kept per runner architecture.
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: runtime
        outputs: type=docker,dest=${{ runner.temp }}/naraen-image.tar
        tags: naraen:dev
        cache-from: type=gha,scope=runtime-${{ runner.arch }}
        cache-to: type=gha,scope=runtime-${{ runner.arch }},mode=max
